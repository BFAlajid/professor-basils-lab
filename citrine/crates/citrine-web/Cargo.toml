[package]
name = "citrine-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen frontend for Citrine"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
citrine-cpu = { path = "../citrine-cpu" }
citrine-core = { path = "../citrine-core" }
citrine-gpu = { path = "../citrine-gpu" }
citrine-kernel = { path = "../citrine-kernel" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
]
